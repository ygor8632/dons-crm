<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão</title>
<style>
  :root { color-scheme: light dark; --bg: #f3ece6; --fg: #1b1716; --muted: #6b605b; --card: rgba(255,255,255,.72); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1716; --fg: #f3ece6; --muted: #b6aca6; --card: rgba(255,255,255,.07); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(420px, 100%); background: var(--card); border-radius: 28px; padding: 28px; text-align: center; box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 20px 50px rgba(27,23,22,.08); }
  h1 { margin: 12px 0 6px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  button { margin-top: 20px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
  <h1>Sem conexão com a internet</h1>
  <p>Seus leads estão salvos. Assim que a conexão voltar, é só tentar de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
